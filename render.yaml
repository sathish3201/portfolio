services:
  - type: web
    name: portfolio-backend
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r server/requirements.txt
    startCommand: cd server && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CLIENT_ORIGIN
        value: https://sathish3201.github.io
      - key: LOCAL_MODEL_URL
        sync: false
      - key: LOCAL_MODEL_API_KEY
        sync: false
      - key: LOCAL_MODEL_NAME
        sync: false
